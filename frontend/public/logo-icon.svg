<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 290" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients & Colors -->
    <linearGradient id="shieldLeftSlope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183123" />
      <stop offset="100%" stop-color="#0f2016" />
    </linearGradient>

    <linearGradient id="shieldRightSlope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#558162" />
      <stop offset="100%" stop-color="#3d6349" />
    </linearGradient>

    <linearGradient id="mountainTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a8668" />
      <stop offset="100%" stop-color="#466f53" />
    </linearGradient>

    <linearGradient id="flameDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#e64a19" />
    </linearGradient>
  </defs>

  <!-- Group centered at (140, 145) -->
  <g id="terra-crest">
    <!-- ==========================================
         1. LOWER SHIELD & RIVER VALLEY TERRAIN
         ========================================== -->
    <!-- Clip Path for the lower shield basin -->
    <clipPath id="shieldBasinClip">
      <path d="M 46 142 C 46 195, 88 238, 140 258 C 192 238, 234 195, 234 142 Z" />
    </clipPath>

    <g clip-path="url(#shieldBasinClip)">
      <!-- Left dark green terrain block -->
      <path d="M 46 142 L 140 142 L 140 258 C 88 238, 46 195, 46 142 Z" fill="url(#shieldLeftSlope)" />
      
      <!-- Right sage green terrain block -->
      <path d="M 140 142 L 234 142 C 234 195, 192 238, 140 258 Z" fill="url(#shieldRightSlope)" />

      <!-- S-Curve Winding River (White) -->
      <path d="M 140 152 
               C 175 168, 185 188, 160 210 
               C 135 230, 155 248, 140 258
               C 128 248, 115 228, 142 206
               C 168 186, 152 168, 135 152 Z" 
            fill="#ffffff" />
      
      <!-- Transverse Valley Road / Dividing Line -->
      <path d="M 40 162 Q 140 138 240 162" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" />
    </g>

    <!-- Lower Shield Border Outline -->
    <path d="M 48 142 C 48 193, 89 235, 140 254 C 191 235, 232 193, 232 142" 
          stroke="#1b3224" stroke-width="5" fill="none" stroke-linecap="round" />

    <!-- ==========================================
         2. 3D ISOMETRIC MOUNTAIN PRISMS
         ========================================== -->
    <!-- Left Mountain -->
    <!-- Front Dark Face -->
    <polygon points="50,165 92,130 92,160 50,180" fill="#172e21" />
    <!-- Top Light Face -->
    <polygon points="50,165 92,130 120,154 78,185" fill="url(#mountainTop)" />
    <!-- Inner Dark Shadow -->
    <polygon points="92,130 120,154 120,172 92,160" fill="#0f2016" />

    <!-- Right Mountain -->
    <!-- Front Dark Face -->
    <polygon points="230,165 188,130 188,160 230,180" fill="#172e21" />
    <!-- Top Light Face -->
    <polygon points="230,165 188,130 160,154 202,185" fill="url(#mountainTop)" />
    <!-- Inner Dark Shadow -->
    <polygon points="188,130 160,154 160,172 188,160" fill="#0f2016" />

    <!-- ==========================================
         3. CENTRAL WATCHTOWER / SENTINEL BEACON
         ========================================== -->
    <!-- Left dark half of tower shaft -->
    <polygon points="135,76 140,76 140,162 131,162" fill="#162d1f" />
    <!-- Right slightly shaded half of tower shaft -->
    <polygon points="140,76 145,76 149,162 140,162" fill="#1d3827" />

    <!-- Watchtower Lantern / Cupola Roof -->
    <!-- Outer Cupola Polygon -->
    <polygon points="140,54 154,68 147,78 133,78 126,68" fill="#183223" />
    
    <!-- Center Beacon Aperture (White Circle) -->
    <circle cx="140" cy="67" r="4.5" fill="#ffffff" />

    <!-- ==========================================
         4. TOP TELEMETRY / RADAR WAVES
         ========================================== -->
    <!-- Inner Radar Wave -->
    <path d="M 120 44 A 24 24 0 0 1 160 44" stroke="#1b3224" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <!-- Outer Radar Wave -->
    <path d="M 108 28 A 38 38 0 0 1 172 28" stroke="#1b3224" stroke-width="5.5" stroke-linecap="round" fill="none" />

    <!-- ==========================================
         5. ORBIT RING & SATELLITE SENSOR NODES
         ========================================== -->
    <!-- Upper Left Arc Segment -->
    <path d="M 68 95 A 92 92 0 0 1 118 52" stroke="#1b3224" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Upper Right Arc Segment -->
    <path d="M 162 52 A 92 92 0 0 1 202 88" stroke="#1b3224" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Lower Left Arc Segment connecting to node -->
    <path d="M 48 142 A 92 92 0 0 1 54 116" stroke="#1b3224" stroke-width="4.5" stroke-linecap="round" fill="none" />
    
    <!-- Left Sensor Node (Sage Green) -->
    <circle cx="54" cy="116" r="9" fill="#507c5d" stroke="#ffffff" stroke-width="1.8" />

    <!-- Right Orange Orbit Segment & Node -->
    <!-- Orange Trail Arc -->
    <path d="M 204 90 A 92 92 0 0 1 216 104" stroke="#ff5722" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Lower Right Arc Segment -->
    <path d="M 232 142 A 92 92 0 0 1 228 126" stroke="#1b3224" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Right Sensor Node (Flame Orange #ff4405) -->
    <circle cx="224" cy="116" r="9" fill="url(#flameDot)" stroke="#ffffff" stroke-width="1.8" />
  </g>
</svg>
