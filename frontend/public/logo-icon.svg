<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Tower & Dark Terrain Colors -->
    <linearGradient id="iconDarkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3427" />
      <stop offset="100%" stop-color="#13231a" />
    </linearGradient>

    <!-- Mountain Slope Colors -->
    <linearGradient id="iconMidGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41684f" />
      <stop offset="100%" stop-color="#2d4c38" />
    </linearGradient>

    <linearGradient id="iconLightGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#558365" />
      <stop offset="100%" stop-color="#3d634b" />
    </linearGradient>

    <!-- Brand Flame Accent (#ff4405) -->
    <linearGradient id="iconFlameOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ff4405" />
    </linearGradient>

    <!-- Emerald Sensor Pip -->
    <linearGradient id="iconPipGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ea27d" />
      <stop offset="100%" stop-color="#4d7c5a" />
    </linearGradient>

    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Radio / Wireless Telemetry Waves (Top of Watchtower) -->
  <path d="M86 35 A 16 16 0 0 1 114 35" stroke="#1f3729" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M78 26 A 26 26 0 0 1 122 26" stroke="#1f3729" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Circular Orbit Ring with Openings for Satellite Nodes -->
  <path d="M46 76 A 64 64 0 0 1 82 32" stroke="#1f3729" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M118 32 A 64 64 0 0 1 154 76" stroke="#1f3729" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M162 108 A 64 64 0 0 1 138 153" stroke="#1f3729" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M62 153 A 64 64 0 0 1 38 108" stroke="#1f3729" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Orbit Satellite Nodes -->
  <!-- Left Node (Sage Green) -->
  <circle cx="40" cy="92" r="7.5" fill="url(#iconPipGreen)" stroke="#ffffff" stroke-width="2" />
  <!-- Right Node (Flame Orange) -->
  <circle cx="160" cy="92" r="7.5" fill="url(#iconFlameOrange)" stroke="#ffffff" stroke-width="2" filter="url(#iconGlow)" />
  <!-- Small Orbit Connecting Tail to Orange Node -->
  <path d="M150 75 Q157 83 159 90" stroke="#ff4405" stroke-width="2.8" fill="none" stroke-linecap="round" />

  <!-- Left Faceted Mountain Range -->
  <polygon points="38,132 38,118 72,88 92,108 92,132" fill="url(#iconDarkGreen)" />
  <polygon points="72,88 92,78 92,108" fill="url(#iconLightGreen)" />
  <polygon points="38,118 72,88 92,108 72,122" fill="url(#iconMidGreen)" opacity="0.9" />

  <!-- Right Faceted Mountain Range -->
  <polygon points="162,132 162,118 128,88 108,108 108,132" fill="url(#iconDarkGreen)" />
  <polygon points="128,88 108,78 108,108" fill="url(#iconLightGreen)" />
  <polygon points="162,118 128,88 108,108 128,122" fill="url(#iconMidGreen)" opacity="0.9" />

  <!-- Central Watchtower Structure -->
  <!-- Tower Body (Tapered) -->
  <polygon points="93,56 107,56 111,124 89,124" fill="url(#iconDarkGreen)" />
  <!-- Tower Apex / Observation Cupola Roof -->
  <polygon points="100,40 113,52 107,56 93,56 87,52" fill="url(#iconDarkGreen)" />
  <!-- Cupola Aperture / Beacon Hole -->
  <polygon points="100,48 104,52 100,55 96,52" fill="#ffffff" />

  <!-- Foreground Valley Terrain and S-Curved Winding River Contour -->
  <!-- Lower Hill Left -->
  <path d="M38 132 Q65 120 93 124 Q75 148 60 158 Q46 148 38 132 Z" fill="url(#iconDarkGreen)" />
  <!-- Lower Hill Right -->
  <path d="M162 132 Q135 120 107 124 Q125 148 140 158 Q154 148 162 132 Z" fill="url(#iconMidGreen)" />
  <!-- Central River Road (Clean White S-Curve Flow) -->
  <path d="M96 124 Q104 132 98 138 Q92 145 102 154 Q106 158 108 162 Q100 162 94 155 Q84 145 90 136 Q95 130 93 124 Z" fill="#ffffff" />
  <!-- Bottom Shield Contour Arc -->
  <path d="M60 158 Q100 178 140 158" stroke="#1f3729" stroke-width="5" stroke-linecap="round" fill="none" />
</svg>
