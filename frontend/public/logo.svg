<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- Tower & Dark Terrain Colors -->
    <linearGradient id="tsDarkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3427" />
      <stop offset="100%" stop-color="#13231a" />
    </linearGradient>

    <!-- Mountain Slope Colors (Faceted Shading) -->
    <linearGradient id="tsMidGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41684f" />
      <stop offset="100%" stop-color="#2d4c38" />
    </linearGradient>

    <linearGradient id="tsLightGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#558365" />
      <stop offset="100%" stop-color="#3d634b" />
    </linearGradient>

    <!-- Brand Flame Accent (#ff4405) -->
    <linearGradient id="tsFlameOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ff4405" />
    </linearGradient>

    <!-- Emerald Sensor Pip -->
    <linearGradient id="tsPipGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ea27d" />
      <stop offset="100%" stop-color="#4d7c5a" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="sensorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- =========================================================================
       1. EMBLEM ICON CREST (Left, center at X: 110, Y: 90, Radius: 65)
       ========================================================================= -->
  <g transform="translate(10, 5)">
    <!-- Base Circular Mask / Contour Background Silhouette -->
    <circle cx="100" cy="85" r="64" fill="#ffffff" opacity="0.01" />

    <!-- Radio / Wireless Telemetry Waves (Top of Watchtower) -->
    <path d="M86 28 A 16 16 0 0 1 114 28" stroke="#1f3729" stroke-width="3.8" stroke-linecap="round" fill="none" />
    <path d="M78 20 A 26 26 0 0 1 122 20" stroke="#1f3729" stroke-width="3.8" stroke-linecap="round" fill="none" />

    <!-- Circular Orbit Ring with Openings for Satellite Nodes -->
    <path d="M46 68 A 62 62 0 0 1 82 25" stroke="#1f3729" stroke-width="3.2" stroke-linecap="round" fill="none" />
    <path d="M118 25 A 62 62 0 0 1 154 68" stroke="#1f3729" stroke-width="3.2" stroke-linecap="round" fill="none" />
    <path d="M161 98 A 62 62 0 0 1 138 143" stroke="#1f3729" stroke-width="3.2" stroke-linecap="round" fill="none" />
    <path d="M62 143 A 62 62 0 0 1 39 98" stroke="#1f3729" stroke-width="3.2" stroke-linecap="round" fill="none" />

    <!-- Orbit Satellite Nodes -->
    <!-- Left Node (Sage Green) -->
    <circle cx="41" cy="83" r="6.5" fill="url(#tsPipGreen)" stroke="#ffffff" stroke-width="1.8" />
    <!-- Right Node (Flame Orange) -->
    <circle cx="159" cy="83" r="6.5" fill="url(#tsFlameOrange)" stroke="#ffffff" stroke-width="1.8" filter="url(#sensorGlow)" />
    <!-- Small Orbit Connecting Tail to Orange Node -->
    <path d="M150 67 Q156 75 158 81" stroke="#ff4405" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Left Faceted Mountain Range -->
    <polygon points="38,122 38,108 72,78 92,98 92,122" fill="url(#tsDarkGreen)" />
    <polygon points="72,78 92,68 92,98" fill="url(#tsLightGreen)" />
    <polygon points="38,108 72,78 92,98 72,112" fill="url(#tsMidGreen)" opacity="0.9" />

    <!-- Right Faceted Mountain Range -->
    <polygon points="162,122 162,108 128,78 108,98 108,122" fill="url(#tsDarkGreen)" />
    <polygon points="128,78 108,68 108,98" fill="url(#tsLightGreen)" />
    <polygon points="162,108 128,78 108,98 128,112" fill="url(#tsMidGreen)" opacity="0.9" />

    <!-- Central Watchtower / Sentry Tower Structure -->
    <!-- Tower Body (Tapered) -->
    <polygon points="93,48 107,48 111,114 89,114" fill="url(#tsDarkGreen)" />
    <!-- Tower Apex / Observation Cupola Roof -->
    <polygon points="100,32 113,44 107,48 93,48 87,44" fill="url(#tsDarkGreen)" />
    <!-- Cupola Aperture / Beacon Hole -->
    <polygon points="100,40 104,44 100,47 96,44" fill="#ffffff" />

    <!-- Foreground Valley Terrain and S-Curved Winding River Contour -->
    <!-- Lower Hill Left -->
    <path d="M38 122 Q65 110 93 114 Q75 138 60 148 Q46 138 38 122 Z" fill="url(#tsDarkGreen)" />
    <!-- Lower Hill Right -->
    <path d="M162 122 Q135 110 107 114 Q125 138 140 148 Q154 138 162 122 Z" fill="url(#tsMidGreen)" />
    <!-- Central River Road (Clean White S-Curve Flow) -->
    <path d="M96 114 Q104 122 98 128 Q92 135 102 144 Q106 148 108 152 Q100 152 94 145 Q84 135 90 126 Q95 120 93 114 Z" fill="#ffffff" />
    <path d="M104 114 Q112 122 108 128 Q102 134 114 145 Q120 150 124 152 Q116 152 108 144 Q98 134 104 125 Q108 120 104 114 Z" fill="#ffffff" opacity="0.3" />
    <!-- Bottom Shield Contour Arc -->
    <path d="M60 148 Q100 168 140 148" stroke="#1f3729" stroke-width="4.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- =========================================================================
       2. VERTICAL DIVIDER LINE
       ========================================================================= -->
  <line x1="225" y1="52" x2="225" y2="128" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round" />

  <!-- =========================================================================
       3. TYPOGRAPHY (TerraSentinel + WATCH • ANALYZE • ALERT)
       ========================================================================= -->
  <g transform="translate(245, 62)">
    <!-- "TerraSentinel" -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      <tspan fill="#111827">Terra</tspan>
      <tspan fill="#3a6349">Sentinel</tspan>
    </text>

    <!-- Tagline: "WATCH • ANALYZE • ALERT" -->
    <text x="4" y="64" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" font-size="12" font-weight="700" letter-spacing="5.5" fill="#475569">
      WATCH <tspan fill="#3a6349" font-size="14">•</tspan> ANALYZE <tspan fill="#ff4405" font-size="14">•</tspan> ALERT
    </text>
  </g>
</svg>
