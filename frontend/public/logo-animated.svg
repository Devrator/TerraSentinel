<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients & Colors -->
    <linearGradient id="animShieldLeftSlope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183123" />
      <stop offset="100%" stop-color="#0f2016" />
    </linearGradient>

    <linearGradient id="animShieldRightSlope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#558162" />
      <stop offset="100%" stop-color="#3d6349" />
    </linearGradient>

    <linearGradient id="animMountainTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a8668" />
      <stop offset="100%" stop-color="#466f53" />
    </linearGradient>

    <linearGradient id="animFlameDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a22" />
      <stop offset="100%" stop-color="#e63e00" />
    </linearGradient>

    <!-- Beacon Glow Filter -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Radar Wave Pulse Looping Animations */
      @keyframes pulseInnerWave {
        0%, 100% {
          opacity: 0.35;
          transform: translateY(0px) scale(0.97);
        }
        50% {
          opacity: 1;
          transform: translateY(-2px) scale(1.03);
          stroke: #25a244;
        }
      }

      @keyframes pulseOuterWave {
        0%, 100% {
          opacity: 0.2;
          transform: translateY(0px) scale(0.95);
        }
        50% {
          opacity: 0.95;
          transform: translateY(-4px) scale(1.05);
          stroke: #2ec4b6;
        }
      }

      /* Beacon Optical Pulse */
      @keyframes beaconBlink {
        0%, 100% {
          r: 4.5;
          opacity: 0.8;
          fill: #ffffff;
        }
        50% {
          r: 6.5;
          opacity: 1;
          fill: #ffaa00;
          filter: drop-shadow(0 0 6px rgba(255, 170, 0, 0.9));
        }
      }

      /* Flame Satellite Node Breathing Glow */
      @keyframes flameBreathing {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 3px rgba(255, 68, 5, 0.4));
        }
        50% {
          transform: scale(1.18);
          filter: drop-shadow(0 0 10px rgba(255, 68, 5, 0.95));
        }
      }

      /* Sage Satellite Node Breathing */
      @keyframes greenBreathing {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 2px rgba(80, 124, 93, 0.3));
        }
        50% {
          transform: scale(1.15);
          filter: drop-shadow(0 0 8px rgba(46, 196, 182, 0.8));
        }
      }

      /* River Flow Shimmer */
      @keyframes riverFlow {
        0% {
          stroke-dashoffset: 60;
          opacity: 0.8;
        }
        50% {
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0.8;
        }
      }

      .anim-wave-inner {
        transform-origin: 140px 44px;
        animation: pulseInnerWave 2.4s ease-in-out infinite;
      }

      .anim-wave-outer {
        transform-origin: 140px 28px;
        animation: pulseOuterWave 2.4s ease-in-out infinite 0.4s;
      }

      .anim-beacon {
        animation: beaconBlink 1.8s ease-in-out infinite;
      }

      .anim-node-flame {
        transform-origin: 224px 116px;
        animation: flameBreathing 2.2s ease-in-out infinite;
      }

      .anim-node-green {
        transform-origin: 54px 116px;
        animation: greenBreathing 2.2s ease-in-out infinite 1.1s;
      }

      .anim-river-flow {
        stroke-dasharray: 12 8;
        animation: riverFlow 3s linear infinite;
      }
    </style>
  </defs>

  <!-- ==========================================
       1. EMBLEM CREST (Left)
       ========================================== -->
  <g transform="translate(15, 0)">
    <!-- Shield basin clip -->
    <clipPath id="animShieldBasinClip">
      <path d="M 46 142 C 46 195, 88 238, 140 258 C 192 238, 234 195, 234 142 Z" />
    </clipPath>

    <g clip-path="url(#animShieldBasinClip)">
      <!-- Left dark green terrain block -->
      <path d="M 46 142 L 140 142 L 140 258 C 88 238, 46 195, 46 142 Z" fill="url(#animShieldLeftSlope)" />
      
      <!-- Right sage green terrain block -->
      <path d="M 140 142 L 234 142 C 234 195, 192 238, 140 258 Z" fill="url(#animShieldRightSlope)" />

      <!-- Base River Contour (White) -->
      <path d="M 140 152 
               C 175 168, 185 188, 160 210 
               C 135 230, 155 248, 140 258
               C 128 248, 115 228, 142 206
               C 168 186, 152 168, 135 152 Z" 
            fill="#ffffff" />

      <!-- River Flow Shimmer Line -->
      <path d="M 138 152 
               C 170 170, 178 190, 155 210 
               C 132 230, 150 248, 138 258" 
            stroke="#a7f3d0" stroke-width="2" fill="none" class="anim-river-flow" />
      
      <!-- Transverse Valley Road / Dividing Line -->
      <path d="M 40 162 Q 140 138 240 162" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" />
    </g>

    <!-- Lower Shield Border Outline -->
    <path d="M 48 142 C 48 193, 89 235, 140 254 C 191 235, 232 193, 232 142" 
          stroke="#1b3224" stroke-width="5" fill="none" stroke-linecap="round" />

    <!-- 3D Mountain Prisms -->
    <!-- Left Mountain -->
    <polygon points="50,165 92,130 92,160 50,180" fill="#172e21" />
    <polygon points="50,165 92,130 120,154 78,185" fill="url(#animMountainTop)" />
    <polygon points="92,130 120,154 120,172 92,160" fill="#0f2016" />

    <!-- Right Mountain -->
    <polygon points="230,165 188,130 188,160 230,180" fill="#172e21" />
    <polygon points="230,165 188,130 160,154 202,185" fill="url(#animMountainTop)" />
    <polygon points="188,130 160,154 160,172 188,160" fill="#0f2016" />

    <!-- Central Watchtower Shaft -->
    <polygon points="135,76 140,76 140,162 131,162" fill="#162d1f" />
    <polygon points="140,76 145,76 149,162 140,162" fill="#1d3827" />

    <!-- Watchtower Lantern / Cupola -->
    <polygon points="140,54 154,68 147,78 133,78 126,68" fill="#183223" />
    <circle cx="140" cy="67" r="4.5" fill="#ffffff" class="anim-beacon" />

    <!-- Top Telemetry Radar Waves (Looping Animations) -->
    <path d="M 120 44 A 24 24 0 0 1 160 44" stroke="#1b3224" stroke-width="5.5" stroke-linecap="round" fill="none" class="anim-wave-inner" />
    <path d="M 108 28 A 38 38 0 0 1 172 28" stroke="#1b3224" stroke-width="5.5" stroke-linecap="round" fill="none" class="anim-wave-outer" />

    <!-- Orbit Ring Segments & Looping Satellite Nodes -->
    <path d="M 68 95 A 92 92 0 0 1 118 52" stroke="#1b3224" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 162 52 A 92 92 0 0 1 202 88" stroke="#1b3224" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 48 142 A 92 92 0 0 1 54 116" stroke="#1b3224" stroke-width="4.5" stroke-linecap="round" fill="none" />
    
    <!-- Left Sensor Node (Green, Breathing) -->
    <circle cx="54" cy="116" r="9" fill="#507c5d" stroke="#ffffff" stroke-width="1.8" class="anim-node-green" />

    <path d="M 204 90 A 92 92 0 0 1 216 104" stroke="#ff5722" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 232 142 A 92 92 0 0 1 228 126" stroke="#1b3224" stroke-width="4.5" stroke-linecap="round" fill="none" />
    
    <!-- Right Sensor Node (Flame Orange #ff4405, Breathing & Glowing) -->
    <circle cx="224" cy="116" r="9" fill="url(#animFlameDot)" stroke="#ffffff" stroke-width="1.8" class="anim-node-flame" />
  </g>

  <!-- ==========================================
       2. VERTICAL DIVIDER SEPARATOR
       ========================================== -->
  <line x1="335" y1="110" x2="335" y2="225" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- ==========================================
       3. TYPOGRAPHY
       ========================================== -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif">
    <!-- Brand Title: "TerraSentinel" -->
    <text x="360" y="172" font-size="58" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#0f172a">Terra</tspan><tspan fill="#2d583b">Sentinel</tspan>
    </text>

    <!-- Subtitle: "WATCH • ANALYZE • ALERT" -->
    <text x="388" y="210" font-size="14.5" font-weight="700" fill="#1b3224" letter-spacing="5.5" opacity="0.9">
      WATCH &#160;&#8226;&#160; ANALYZE &#160;&#8226;&#160; ALERT
    </text>
  </g>
</svg>
